[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "matchstream"
version = "1.0.0"
description = "Real-time football analytics and event-streaming platform"
requires-python = ">=3.11"

dependencies = [
    "confluent-kafka>=2.12,<3",
    "fastapi>=0.115,<1",
    "prometheus-client>=0.21,<1",
    "psycopg[binary]>=3.2,<4",
    "uvicorn>=0.30,<1",
    "websockets>=14,<17",
]

[project.scripts]
matchstream = "matchstream.cli:main"

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "pytest",
    "pytest-cov",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-m 'not integration'"
markers = ["integration: requires local Redpanda and/or PostgreSQL services"]

[tool.ruff]
line-length = 100
target-version = "py311"
